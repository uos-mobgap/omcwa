name: Wheels

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      smoke:
        description: "Build smoke-test wheels only (ubuntu x86_64)"
        required: false
        default: "false"

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x86_64
            os: ubuntu-latest
            cibw-build: "cp3{11,12,13,14}-manylinux_x86_64"
          - name: ubuntu-aarch64
            os: ubuntu-latest
            cibw-build: "cp3{11,12,13,14}-manylinux_aarch64"
          - name: macos-arm64
            os: macos-14
            cibw-build: "cp3{11,12,13,14}-macosx_arm64"
          - name: windows-amd64
            os: windows-latest
            cibw-build: "cp3{11,12,13,14}-win_amd64"
          - name: windows-arm64
            os: windows-latest
            cibw-build: "cp3{11,12,13,14}-win_arm64"

    # release: always all matrix entries
    # manual: all entries unless smoke=true (then only ubuntu-x86_64)
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.smoke != 'true' || matrix.name == 'ubuntu-x86_64'))

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_BUILD: ${{ matrix.cibw-build }}
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_TEST_COMMAND: "python -c \"import omcwa; print(omcwa.__version__)\""
          CIBW_TEST_REQUIRES: "numpy"
          CIBW_ENVIRONMENT: "PIP_ONLY_BINARY=numpy"

      # TODO: attach wheels to the gitHub release and/or upload to pypi.
      # these are workflow artifacts only.
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
