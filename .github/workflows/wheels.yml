name: Wheels

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw-build: "cp3{11,12,13,14}-manylinux_*"
          - os: macos-14
            cibw-build: "cp3{11,12,13,14}-macosx_arm64"
          - os: macos-13
            cibw-build: "cp3{11,12,13,14}-macosx_x86_64"
          - os: windows-latest
            cibw-build: "cp3{11,12,13,14}-win_amd64"

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_BUILD: ${{ matrix.cibw-build }}
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_TEST_COMMAND: "python -c \"import omcwa; print(omcwa.__version__)\""

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  test:
    name: Pytest on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Lint and test
        run: |
          uv sync --all-groups
          uv run ruff check src tests
          uv run ruff format --check src tests
          ./scripts/check_cpp_format.sh
          uv run pytest -q
