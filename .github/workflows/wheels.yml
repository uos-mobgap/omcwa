name: Wheels

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      smoke:
        description: "Build smoke-test wheels only (ubuntu x86_64)"
        required: false
        default: "false"

jobs:
  build_wheels_smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke == 'true'
    name: Wheels on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x86_64
            os: ubuntu-latest
            cibw-build: "cp3{11,12,13,14}-manylinux_x86_64"

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-wheels
        with:
          cibw-build: ${{ matrix.cibw-build }}
          artifact-name: wheels-${{ matrix.name }}

  build_wheels:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.smoke != 'true')
    name: Wheels on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x86_64
            os: ubuntu-latest
            cibw-build: "cp3{11,12,13,14}-manylinux_x86_64"
          - name: ubuntu-aarch64
            os: ubuntu-latest
            cibw-build: "cp3{11,12,13,14}-manylinux_aarch64"
          - name: macos-arm64
            os: macos-14
            cibw-build: "cp3{11,12,13,14}-macosx_arm64"
          - name: windows-amd64
            os: windows-latest
            cibw-build: "cp3{11,12,13,14}-win_amd64"
          - name: windows-arm64
            os: windows-latest
            cibw-build: "cp3{11,12,13,14}-win_arm64"

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-wheels
        with:
          cibw-build: ${{ matrix.cibw-build }}
          artifact-name: wheels-${{ matrix.name }}
