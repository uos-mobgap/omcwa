[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "omcwa"
version = "0.1.0"
description = "CWA load, calibrate, and resample via vendored OpenMovement omconvert"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=1.25",
    "pybind11>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/uos-mobgap/omcwa"
Repository = "https://github.com/uos-mobgap/omcwa"
Issues = "https://github.com/uos-mobgap/omcwa/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15.21",
]
bench = [
    "pytest>=8",
    "pytest-benchmark>=5",
    # peak resident memory only. Every other platform reads it from resource
    "psutil>=5.9; sys_platform == 'win32'",
]
showcase = [
    "ipykernel>=6.25,<7",
    "jupyter>=1.1",
    "jupytext>=1.19",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15.21",
]
bench = [
    "pytest>=8",
    "pytest-benchmark>=5",
    # peak resident memory only. Every other platform reads it from resource
    "psutil>=5.9; sys_platform == 'win32'",
]
showcase = [
    "ipykernel>=6.25,<7",
    "jupyter>=1.1",
    "jupytext>=1.19",
    "matplotlib>=3.9",
]

[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = ["src/omcwa"]
minimum-version = "0.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

# reported, never gated. No fail_under: coverage is a number to read, not a
# threshold that fails the build.
[tool.coverage.run]
source = ["src/omcwa"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
package = true
