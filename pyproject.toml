[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "omcwa"
version = "0.1.0"
description = "CWA load, calibrate, and resample via vendored OpenMovement omconvert"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=1.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.15.21",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15.21",
]

[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = ["src/omcwa"]
minimum-version = "0.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
package = true
